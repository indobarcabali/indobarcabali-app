<!doctype html>
<!--
  ============================================================
  INDOBARCA BALI — halaman pembungkus untuk GitHub Pages
  ============================================================

  Kenapa halaman ini ada:

  iOS mengambil ikon layar utama dari tag <link rel="apple-touch-icon"> pada
  halaman yang di-bookmark. Kalau anggota mem-bookmark URL /exec, halaman itu
  adalah halaman pembungkus milik Google — dan Apps Script tidak menyediakan
  cara menambahkan tag tersebut ke sana. Tanpa tag itu, iOS membuat ikon dari
  huruf pertama judul: "I".

  Halaman ini adalah halaman yang KITA kendalikan. Di sini tag itu bisa dipasang.
  Sekalian: bilah peringatan abu-abu dari Google hilang, dan aplikasi terbuka
  tanpa bilah Safari sehingga terasa seperti aplikasi sungguhan.

  ------------------------------------------------------------
  CARA MENERBITKAN (sekali saja, ~5 menit, tanpa perintah apa pun)
  ------------------------------------------------------------
  1. Buat repositori GitHub BARU dan bersifat PUBLIC, misalnya "indobarca-app".
     Harus public: GitHub Pages gratis hanya berlaku untuk repo public.
     JANGAN mengubah repo aplikasi jadi public — di sana ada PIN darurat.
     Isi halaman ini tidak memuat rahasia apa pun, hanya iframe dan tag ikon.

  2. Unggah DUA berkas ke repo itu (Add file → Upload files):
       - berkas ini, dengan nama tepat  index.html
       - logo 512x512 BERLATAR SOLID, dengan nama tepat  icon.png
     Nama berkasnya harus persis seperti itu, huruf kecil semua.

     icon.png hanya dipakai untuk ikon layar utama, yang menuntut latar solid.
     Ikon tab mengambil berkas Drive yang sama dengan aplikasi — latar transparan,
     karena di tab lambang bulat lebih rapi daripada kotak berwarna.

  3. Settings → Pages → Source: "Deploy from a branch", Branch: main, folder: /
     Simpan, tunggu 1-2 menit.

  4. Alamat yang berlaku sekarang — INILAH yang dibagikan ke anggota:
       https://indobarcabali10-cell.github.io/indobarcabali-app/

  5. Setiap kali berkas ini diperbarui, GitHub menyetel cache 10 menit
     (cache-control: max-age=600). Selama jeda itu peramban tetap menampilkan
     salinan lama sekeras apa pun tombol muat ulang ditekan. Untuk memeriksa
     versi baru seketika: buka di tab Private, atau tambahkan ?v=2 di ujung
     alamat. Tampilan yang "tidak berubah" hampir selalu ini, bukan kegagalan.

  ------------------------------------------------------------
  UJI DULU SEBELUM DIBAGIKAN KE ANGGOTA
  ------------------------------------------------------------
  Token login anggota tersimpan di penyimpanan lokal peramban, pada domain milik
  Google. Begitu aplikasi dibungkus halaman dari domain lain, penyimpanan itu
  menjadi "pihak ketiga" — dan iOS Safari memblokir atau memisahkannya secara
  bawaan. Akibat terburuknya: anggota tidak bisa login, atau ter-logout setiap
  kali menutup aplikasi.

  Jadi: buka alamat di atas di iPhone Anda sendiri, login, tutup penuh, buka
  lagi. Kalau masih masuk tanpa diminta PIN, aman untuk dibagikan.
  Kalau tidak, jangan dibagikan — URL /exec tetap berfungsi seperti biasa dan
  bisa terus dipakai. Ikon huruf "I" adalah harga yang jauh lebih murah
  dibanding login yang rusak.
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INDOBARCA BALI — Community App</title>

<!-- Ikon layar utama iOS. Satu berkas 512x512 cukup; iOS menskalakannya sendiri.
     Latarnya WAJIB solid, bukan transparan: area transparan menjadi hitam di
     layar utama iOS, bukan menyatu dengan wallpaper. -->
<link rel="apple-touch-icon" href="icon.png">

<!-- Ikon TAB memakai berkas Drive yang sama dengan yang dipakai aplikasi lewat
     setFaviconUrl(), supaya tab dari alamat ini dan tab dari /exec selalu
     seragam — satu berkas, satu tempat mengurusnya.
     Sengaja BUKAN icon.png: berkas itu berlatar solid karena tuntutan layar
     utama iOS, dan di tab ia tampil sebagai kotak berwarna alih-alih lambang
     bulat yang menyatu dengan latar tab. Dua keperluan, dua berkas. -->
<link rel="icon" type="image/png"
      href="https://drive.google.com/thumbnail?id=197Ne_Sj_bLQYaKpQFMQywGTz59WIJJo2&amp;sz=w128">

<!-- Android tidak butuh tag tersendiri: tanpa manifest, Chrome ikut memakai
     apple-touch-icon di atas untuk ikon layar utamanya. Menambahkan <link
     rel="icon" sizes="512x512"> di sini justru membuat dua tag ikon tab saling
     bersaing, dan peramban bebas memilih yang mana — hasilnya tidak menentu. -->

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Indobarca Bali">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Warna bilah status dan pita area aman. Disamakan dengan warna sidebar
     aplikasi (#001138, palet Barca resmi) agar tampak menyatu. Kalau suatu saat
     palet aplikasi diganti, cukup ubah nilai di sini dan di background body. -->
<meta name="theme-color" content="#001138">
<meta name="robots" content="noindex">

<style>
  /* Warna ini bukan sekadar latar di belakang iframe: di mode aplikasi iOS,
     pita di belakang home indicator dan bilah status DICAT oleh sistem memakai
     warna latar body. Jadi inilah satu-satunya tuas yang menentukan warna pita
     itu — elemen apa pun yang digambar di atasnya tidak berpengaruh. */
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#001138;}

  /* Aplikasi ditempatkan di dalam area aman, bukan memenuhi layar mentah.
     apple-mobile-web-app-capable menghilangkan seluruh bilah Safari, sehingga
     isi halaman dimulai dari piksel paling atas — tepat di bawah jam dan
     indikator baterai. Ruang itu dulu ditempati bilah alamat Safari, jadi
     masalahnya tidak pernah muncul sebelum halaman ini ada.

     Aplikasinya TIDAK bisa memperbaiki sendiri: nilai env(safe-area-inset-*)
     tidak menembus ke dalam iframe — di sana nilainya selalu nol. Hanya dokumen
     utama yang bisa membacanya, dan itu halaman ini.

     Inset dipasang pada WADAH, bukan langsung pada iframe. <iframe> adalah
     elemen tergantikan: pada elemen semacam itu width/height:auto tidak melebar
     mengikuti inset, melainkan jatuh ke ukuran bawaannya 300x150 piksel. Wadah
     biasa melebar seperti yang diharapkan, lalu iframe mengisinya penuh. */
  #bingkai{
    position:fixed;
    top:env(safe-area-inset-top, 0px);
    right:env(safe-area-inset-right, 0px);
    left:env(safe-area-inset-left, 0px);
    /* Sengaja TIDAK disisakan di bawah. Aplikasi dibiarkan turun sampai tepi
       layar supaya latar bilah navigasinya menyentuh dasar, seperti bilah bawah
       aplikasi mobile pada umumnya. Yang diberi ruang aman cukup ikon-ikonnya —
       aplikasi mengerjakan itu sendiri setelah diberi tahu ukurannya. */
    bottom:0;
  }

  /* Pengukur ruang aman bawah. Tak terlihat; hanya tingginya yang dibaca.
     env() tidak bisa dibaca langsung dari JavaScript, dan tidak menembus ke
     dalam iframe — jadi halaman inilah satu-satunya yang bisa mengukurnya. */
  #ukur{
    position:fixed;bottom:0;left:0;width:0;pointer-events:none;
    height:env(safe-area-inset-bottom, 0px);
  }
  #bingkai iframe{width:100%;height:100%;border:0;display:block;}

  /* Layar pemuatan, tampil di depan iframe sampai aplikasi selesai dimuat. */
  #memuat{
    position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#071744;
    color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    transition:opacity .4s ease;
  }
  #memuat.selesai{opacity:0;pointer-events:none;}
  #memuat .tulisan{letter-spacing:.18em;font-size:12px;color:rgba(255,255,255,.65);margin-top:16px;}
  @keyframes putar{to{transform:rotate(360deg)}}
  #memuat svg{animation:putar 2.6s linear infinite;}

  /* Jalan keluar, muncul hanya bila aplikasi tak selesai dimuat dalam 12 detik.
     Tanpa ini, iframe yang gagal memuat menyisakan layar biru tanpa penjelasan
     dan tanpa cara keluar. */
  #darurat{
    position:fixed;bottom:calc(24px + env(safe-area-inset-bottom, 0px));left:0;right:0;
    z-index:3;text-align:center;font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;display:none;
  }
  #darurat a{color:#F7C331;text-decoration:underline;}
</style>
</head>
<body>

<div id="memuat">
  <div style="text-align:center">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#F7C331"
         stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7l3.5 2.5-1.3 4.1h-4.4L8.5 9.5z"/>
      <path d="M12 2v5M20.5 9l-4.8 1.5M17.2 19.5l-2.9-4M6.8 19.5l2.9-4M3.5 9l4.8 1.5"/>
    </svg>
    <div class="tulisan">MEMUAT…</div>
    <!-- Penanda versi halaman pembungkus. Naikkan angkanya setiap kali berkas
         ini diubah. Gunanya menjawab satu pertanyaan yang selalu muncul setelah
         mengunggah: yang tampil ini versi baru atau salinan lama dari cache?
         Tanpa penanda, satu-satunya cara menjawabnya adalah menebak. -->
    <div class="tulisan" style="margin-top:6px;opacity:.45;letter-spacing:.24em">R4</div>
  </div>
</div>

<div id="darurat">
  Aplikasi lama dimuat —
  <a href="https://script.google.com/macros/s/AKfycbw03EKLPzGnF7tj4v2gqOz05lnVswFPt8J_wfPhNlyExMH4mGMLKiADZMbFXGsgDvKc/exec">buka langsung di peramban</a>
</div>

<div id="ukur" aria-hidden="true"></div>

<div id="bingkai">
  <iframe
    id="aplikasi"
    title="INDOBARCA BALI — Community App"
    src="https://script.google.com/macros/s/AKfycbw03EKLPzGnF7tj4v2gqOz05lnVswFPt8J_wfPhNlyExMH4mGMLKiADZMbFXGsgDvKc/exec"
    allow="clipboard-write *; fullscreen *"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
  var memuat = document.getElementById('memuat');
  var selesai = false;

  document.getElementById('aplikasi').addEventListener('load', function () {
    selesai = true;
    setTimeout(function () { memuat.classList.add('selesai'); }, 400);
  });

  // Jaring pengaman: iframe yang diblokir tidak pernah memicu peristiwa 'load'.
  setTimeout(function () {
    if (!selesai) document.getElementById('darurat').style.display = 'block';
  }, 12000);

  /* ---------------------------------------------------------------
     Memberi tahu aplikasi setinggi apa ruang aman di bawah layar.

     Aplikasi tidak bisa mengukurnya sendiri: env(safe-area-inset-*) selalu
     bernilai nol di dalam iframe, dan angkanya berbeda antar model iPhone —
     menebak dengan angka mati akan salah di perangkat tanpa home indicator.

     Aplikasi yang memulai percakapan, bukan halaman ini. Sebabnya praktis:
     aplikasi berada di iframe bersarang milik Google, jadi halaman ini tidak
     punya cara menunjuk jendelanya secara langsung. Begitu aplikasi menyapa,
     jendelanya terbaca dari event.source dan bisa dibalas.
     --------------------------------------------------------------- */
  var peminta = null;

  function ruangAmanBawah() {
    var n = parseFloat(getComputedStyle(document.getElementById('ukur')).height);
    return isNaN(n) ? 0 : Math.round(n);
  }

  function kabari() {
    if (peminta) peminta.postMessage({ ibb: 'inset', bawah: ruangAmanBawah() }, '*');
  }

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.ibb !== 'minta-inset' || !e.source) return;
    peminta = e.source;
    kabari();
  });

  // Nilainya berubah saat perangkat diputar.
  window.addEventListener('resize', kabari);
  window.addEventListener('orientationchange', function () { setTimeout(kabari, 300); });
</script>

</body>
</html>
