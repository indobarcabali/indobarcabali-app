name: Perbarui jadwal Barcelona

# Sekali sehari sudah cukup: jadwal pertandingan jarang berubah dalam hitungan
# jam, dan tiap jalannya menghasilkan commit yang memicu pembangunan ulang
# GitHub Pages. Lebih sering hanya menambah derau di riwayat.
on:
  schedule:
    - cron: '17 22 * * *'   # 22:17 UTC = 06:17 WITA, sebelum orang bangun
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: jadwal
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil jadwal
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 alat/ambil-jadwal.py

      - name: Simpan kalau berubah
        run: |
          if git diff --quiet -- jadwal.json; then
            echo "Tidak ada perubahan, tidak ada commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jadwal.json
          git commit -m "Perbarui jadwal Barcelona (otomatis)"
          git push
