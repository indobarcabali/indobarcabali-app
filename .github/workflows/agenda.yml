name: Perbarui agenda komunitas

# Agenda kegiatan diambil dari feed publik aplikasi (?feed=agenda), yang hanya
# berisi kolom aman untuk umum. Tiap 3 jam: sisa slot berubah lebih cepat
# daripada jadwal Barça, tapi pengunjung tidak butuh hitungan menit.
# Commit hanya dibuat kalau isinya berubah.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agenda.yml'

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil agenda
        run: |
          URL='https://script.google.com/macros/s/AKfycbwYa13TLyaJ3moyHeQn7d4vH4F3P1T3oX9a7Vcb10kCofT8Mq9Sq2dThOAf5nigq_PL/exec?feed=agenda'
          curl -sSfL --max-time 60 "$URL" -o baru.json
          # Halaman galat Apps Script berupa HTML; hanya JSON yang punya kunci
          # "agenda" yang boleh menimpa berkas lama.
          python3 -c "import json; d=json.load(open('baru.json')); assert isinstance(d.get('agenda'), list)"
          python3 -c "import json; d=json.load(open('baru.json')); json.dump(d, open('agenda.json','w'), ensure_ascii=False, indent=1)"
          rm baru.json

      - name: Simpan kalau berubah
        run: |
          # "diperbarui" selalu berganti; bandingkan isi agendanya saja supaya
          # tidak ada commit tiap 3 jam tanpa perubahan nyata.
          if git cat-file -e HEAD:agenda.json 2>/dev/null; then
            lama=$(git show HEAD:agenda.json | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['agenda'], sort_keys=True))")
            kini=$(python3 -c "import json; print(json.dumps(json.load(open('agenda.json'))['agenda'], sort_keys=True))")
            if [ "$lama" = "$kini" ]; then
              echo "Agenda tidak berubah, tidak ada commit."
              exit 0
            fi
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Perbarui agenda komunitas (otomatis)"
          git push
